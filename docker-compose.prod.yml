# Production qatlami:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Tashqariga faqat Caddy (80/443) ochiq; qolgan servislar ichki tarmoqda.
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi kerak}

  redis:
    restart: unless-stopped

  ai-service:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY kerak}
      SEED_DEMO_DATA: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agroyordam}
      CORS_ORIGINS: https://${DOMAIN}
      PAYMENT_RETURN_URL: https://${DOMAIN}/premium

  web:
    restart: unless-stopped
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN kerak (masalan agroyordam.uz)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Har kuni PostgreSQL + rasmlar zaxirasi → ./backups (7 kun) va (sozlansa) server tashqarisidagi S3 xotira (30 kun).
  # Holat: docker compose ... exec backup backup.sh check | Batafsil: docs/BACKUP.md
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-agro}
      POSTGRES_DB: ${POSTGRES_DB:-agroyordam}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-22}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_ACCESS_KEY: ${OFFSITE_S3_ACCESS_KEY:-}
      OFFSITE_S3_SECRET_KEY: ${OFFSITE_S3_SECRET_KEY:-}
    volumes: ["./backups:/backups", "media:/media:ro"]
    healthcheck:
      test: ["CMD", "backup.sh", "check"]
      interval: 1h
      start_period: 30m

volumes:
  caddy_data:
  caddy_config:
