# Production qatlami:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Tashqariga faqat Caddy (80/443) ochiq; qolgan servislar ichki tarmoqda.
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi kerak}

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY kerak}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY kerak}

  ai-service:
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY kerak}
      SEED_DEMO_DATA: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agroyordam}
      CORS_ORIGINS: https://${DOMAIN}
      S3_PUBLIC_URL: https://${DOMAIN}/s3/agroyordam
      PAYMENT_RETURN_URL: https://${DOMAIN}/premium

  web:
    restart: unless-stopped
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, minio]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN kerak (masalan agroyordam.uz)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Har kuni PostgreSQL zaxira nusxasi → ./backups (7 kun saqlanadi)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["./backups:/backups"]
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U ${POSTGRES_USER:-agro} ${POSTGRES_DB:-agroyordam} | gzip > /backups/agroyordam-$$(date +%F).sql.gz && find /backups -name '*.sql.gz' -mtime +7 -delete; sleep 86400; done"]

volumes:
  caddy_data:
  caddy_config:
