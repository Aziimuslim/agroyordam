name: Android APK

on:
  push:
    branches: [main, "claude/**"]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.35.4", channel: stable, cache: true}
      - run: flutter pub get
      - name: APK yig'ish (release)
        # Standart: jonli server. Boshqa server uchun Repo Settings → Variables → API_URL
        env:
          API_URL: ${{ vars.API_URL || 'https://agroyordam.duckdns.org' }}
        run: flutter build apk --release ${API_URL:+--dart-define=API_URL=$API_URL}
      - name: Nomlash
        run: cp build/app/outputs/flutter-apk/app-release.apk build/AgroYordam-0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AgroYordam-0.1-apk
          path: mobile/build/AgroYordam-0.1.apk
      - name: GitHub Release'ga yuklash (v0.1.0)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --prerelease --target "$GITHUB_SHA" \
            --title "AgroYordam 0.1 (APK)" --notes-file .github/apk-release-notes.md
          gh release upload v0.1.0 mobile/build/AgroYordam-0.1.apk --clobber
          gh release edit v0.1.0 --notes-file .github/apk-release-notes.md
