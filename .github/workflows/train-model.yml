name: Train AI model

on:
  workflow_dispatch:
    inputs:
      dataset_url:
        description: "Dala dataseti ZIP havolasi (admin panel → Dataset → eksport; masalan GitHub Release'ga yuklangan fayl). Bo'sh — faqat PlantVillage"
        required: false
        default: ""
  push:
    branches: [main, "claude/**"]
    paths: ["ai-service/training/**", "ai-service/app/models/labels.py", "ai-service/app/inference/preprocess.py", ".github/workflows/train-model.yml"]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r ai-service/training/requirements.txt
      - name: PlantVillage dataset (kerakli sinflar)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/spMohanty/PlantVillage-Dataset /tmp/pv
          cd /tmp/pv
          git sparse-checkout set --no-cone \
            "raw/color/Tomato___Bacterial_spot" \
            "raw/color/Tomato___Early_blight" \
            "raw/color/Tomato___Late_blight" \
            "raw/color/Tomato___Leaf_Mold" \
            "raw/color/Tomato___Septoria_leaf_spot" \
            "raw/color/Tomato___Spider_mites Two-spotted_spider_mite" \
            "raw/color/Tomato___Target_Spot" \
            "raw/color/Tomato___Tomato_Yellow_Leaf_Curl_Virus" \
            "raw/color/Tomato___Tomato_mosaic_virus" \
            "raw/color/Tomato___healthy" \
            "raw/color/Potato___Early_blight" \
            "raw/color/Potato___Late_blight" \
            "raw/color/Potato___healthy" \
            "raw/color/Pepper,_bell___Bacterial_spot" \
            "raw/color/Pepper,_bell___healthy" \
            "raw/color/Grape___Black_rot" \
            "raw/color/Grape___Esca_(Black_Measles)" \
            "raw/color/Grape___Leaf_blight_(Isariopsis_Leaf_Spot)" \
            "raw/color/Grape___healthy" \
            "raw/color/Apple___Apple_scab" \
            "raw/color/Apple___Black_rot" \
            "raw/color/Apple___Cedar_apple_rust" \
            "raw/color/Apple___healthy" \
            "raw/color/Corn_(maize)___Cercospora_leaf_spot Gray_leaf_spot" \
            "raw/color/Corn_(maize)___Common_rust_" \
            "raw/color/Corn_(maize)___Northern_Leaf_Blight" \
            "raw/color/Corn_(maize)___healthy" \
            "raw/color/Peach___Bacterial_spot" \
            "raw/color/Peach___healthy" \
            "raw/color/Cherry_(including_sour)___Powdery_mildew" \
            "raw/color/Cherry_(including_sour)___healthy" \
            "raw/color/Strawberry___Leaf_scorch" \
            "raw/color/Strawberry___healthy" \
            "raw/color/Squash___Powdery_mildew"
          du -sh raw/color
      - name: Dala dataseti (ixtiyoriy)
        if: ${{ github.event.inputs.dataset_url != '' }}
        env:
          DATASET_URL: ${{ github.event.inputs.dataset_url }}
        run: |
          curl -fsSL -o /tmp/field.zip "$DATASET_URL"
          mkdir -p /tmp/field && unzip -q /tmp/field.zip -d /tmp/field
          find /tmp/field -mindepth 1 -maxdepth 1 -type d -exec sh -c 'echo "$(basename "$1"): $(ls "$1" | wc -l)"' _ {} \;
      - name: O'qitish va ONNX eksport
        working-directory: ai-service
        run: |
          EXTRA=""
          [ -d /tmp/field ] && EXTRA="--extra /tmp/field"
          python training/train_plantvillage.py --data /tmp/pv/raw/color --out models/agro-mobilenetv3.onnx $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: agro-model
          path: ai-service/models/
      - name: Release'ga yuklash (model-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view model-v1 >/dev/null 2>&1 || gh release create model-v1 --prerelease --target "$GITHUB_SHA" \
            --title "AgroYordam AI model v1 (PlantVillage, MobileNetV3)" \
            --notes "PlantVillage'da o'qitilgan kasallik klassifikatori (34 sinf, 11 ekin). Aniqlik: agro-mobilenetv3.metrics.json"
          gh release upload model-v1 ai-service/models/agro-mobilenetv3.onnx ai-service/models/agro-mobilenetv3.labels.txt \
            ai-service/models/agro-mobilenetv3.metrics.json --clobber
