name: Docker stack (smoke test + deploy)

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # CI'da tashqi zaxira xotirasi o'rniga mahalliy S3 (rclone serve s3) ishlatiladi
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f deploy/ci/offsite-s3.yml
    steps:
      - uses: actions/checkout@v4
      - name: Production .env (DOMAIN=localhost)
        run: |
          cp .env.production.example .env
          sed -i "s/^DOMAIN=.*/DOMAIN=localhost/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i -e "s|^OFFSITE_S3_ENDPOINT=.*|OFFSITE_S3_ENDPOINT=http://s3:9000|" \
                 -e "s|^OFFSITE_S3_REGION=.*|OFFSITE_S3_REGION=us-east-1|" \
                 -e "s|^OFFSITE_S3_BUCKET=.*|OFFSITE_S3_BUCKET=agro-ci|" \
                 -e "s|^OFFSITE_S3_ACCESS_KEY=.*|OFFSITE_S3_ACCESS_KEY=ciaccesskey|" \
                 -e "s|^OFFSITE_S3_SECRET_KEY=.*|OFFSITE_S3_SECRET_KEY=cisecretkey123|" .env
      - name: Image'larni yig'ish
        run: $COMPOSE build
      - name: Stack'ni ishga tushirish
        run: $COMPOSE up -d
      - name: Tayyor bo'lishini kutish
        run: |
          for i in $(seq 1 60); do
            curl -skf https://localhost/health && exit 0
            sleep 5
          done
          exit 1
      - name: AI model yuklanganini tekshirish
        run: $COMPOSE exec -T ai-service python -c "import urllib.request as u; print(u.urlopen('http://localhost:8001/health').read().decode())"
      - name: Smoke test
        run: python3 deploy/smoke_test.py https://localhost
      - name: Admin yaratish buyrug'i
        run: $COMPOSE exec -T backend python -m app.create_admin --username ciadmin --email ci@example.com --password "Ci-admin-12345"
      - name: Backup servisi (serverda + tashqi S3)
        run: |
          for i in $(seq 1 36); do test -f backups/status && break; sleep 5; done; cat backups/status
          ls -la backups/
          $COMPOSE exec -T backup backup.sh now
          $COMPOSE exec -T backup backup.sh check
          $COMPOSE exec -T backup backup.sh list | tee /tmp/list.txt
          sed -n '/Tashqi/,$p' /tmp/list.txt | grep -q '^  20'
      - name: Zaxiradan tiklash (restore.sh)
        run: |
          q() { $COMPOSE exec -T db psql -U agro agroyordam -tAc "$1"; }
          before="$(q 'SELECT count(*) FROM users')"
          q "TRUNCATE users CASCADE"
          sudo rm -f backups/agroyordam-*.sql.gz   # tashqi xotiradan yuklab olishni ham sinaymiz
          sudo bash deploy/restore.sh latest --yes
          after="$(q 'SELECT count(*) FROM users')"
          echo "users: $before → $after"
          test "$before" -gt 0 && test "$before" = "$after"
          for i in $(seq 1 30); do curl -skf https://localhost/health && exit 0; sleep 3; done; exit 1
      - name: Loglar (xato bo'lsa)
        if: failure()
        run: |
          $COMPOSE ps -a && $COMPOSE logs --tail=150
          # Qisqa xulosa annotatsiya sifatida (loglarni ochmasdan ko'rinsin)
          $COMPOSE ps -a --format '{{.Service}}: {{.Status}}' | while read -r l; do echo "::notice::$l"; done
          for svc in $($COMPOSE ps -a --format '{{.Service}} {{.State}}' | awk '$2!="running"{print $1}'); do
            echo "::error title=$svc::$($COMPOSE logs --tail=8 --no-log-prefix "$svc" 2>&1 | tr '\n' ' ' | cut -c1-900)"
          done
      - run: $COMPOSE down -v
        if: always()

  deploy:
    needs: smoke
    # Asosiy (default) branch'ga push bo'lganda (yoki qo'lda "Run workflow") serverga chiqariladi
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: {group: production-deploy, cancel-in-progress: false}
    environment:
      name: production
      url: https://agroyordam.duckdns.org
    env:
      HAS_SERVER: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}
    steps:
      - name: Server sozlanmagan
        if: env.HAS_SERVER != 'true'
        run: |
          echo "::warning::SERVER_HOST / SERVER_USER / SERVER_SSH_KEY secret'lari yo'q — deploy o'tkazib yuborildi."
          echo "Serverda bir marta: cd /opt/agroyordam && sudo git pull && sudo bash deploy/enable-autodeploy.sh"
      - name: Deploy kalitini tayyorlash
        if: env.HAS_SERVER == 'true'
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          # Kalit ikki ko'rinishda qabul qilinadi: to'liq matn (-----BEGIN ... -----END) yoki bitta qatorli base64.
          # Windows'dan nusxalashdagi \r va qator oxiridagi bo'shliqlar tozalanadi.
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          umask 077
          if printf '%s' "$KEY" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > "$KEY_FILE"
          else
            printf '%s' "$KEY" | tr -d ' \r\n\t' | base64 -d > "$KEY_FILE" 2>/dev/null || true
          fi
          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY noto'g'ri. Serverda: sudo base64 -w0 /home/ubuntu/.ssh/agroyordam_deploy — chiqqan bitta qatorni secret'ga qo'ying."
            exit 1
          fi
          echo "Kalit to'g'ri: $(ssh-keygen -l -f "$KEY_FILE" | awk '{print $2}')"
      - name: Serverga deploy (deploy/deploy.sh — xato bo'lsa avtomatik rollback)
        if: env.HAS_SERVER == 'true'
        timeout-minutes: 50
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Kalit serverda faqat deploy.sh'ni ishga tushirishga cheklangan; bu yerdagi matn branch nomi sifatida uzatiladi
          HOST="$(printf '%s' "$HOST" | tr -d '[:space:]')"; USER_NAME="$(printf '%s' "$USER_NAME" | tr -d '[:space:]')"
          ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "${USER_NAME:-ubuntu}@$HOST" "deploy $BRANCH"
      - name: Kalitni o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key"
