limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    client_max_body_size 12m;

    # Haqiqiy foydalanuvchi IP'si (Caddy X-Forwarded-For'ni o'zi to'g'ri qo'yadi): so'rov chegarasi har
    # foydalanuvchiga alohida bo'lsin, hammaga umumiy emas. Faqat ichki Docker tarmog'iga ishoniladi.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    # Backend manzili har so'rovda Docker DNS orqali aniqlanadi: backend qayta ishga tushib, yangi
    # ichki IP olsa ham nginx eski manzilga yopishib qolmaydi.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8000;

    # Flutter Web ilova
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        # Flutter har build'da fayllarni (masalan ikonka shrifti) o'sha nom bilan yangilaydi — brauzer har safar
        # tekshirsin (o'zgarmagan bo'lsa 304, yuklab olinmaydi), aks holda eski shrift bilan ikonkalar yo'qoladi
        add_header Cache-Control "no-cache" always;
    }

    # Admin web panel (alohida sahifa, faqat kompyuter uchun): har doim yangi versiya, boshqa saytga joylab bo'lmaydi
    location /admin/ {
        try_files $uri /admin/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /admin {
        return 301 /admin/;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # admin: AI model versiyasini almashtirish (yuklab olish + tekshirish) uzoqroq davom etadi
    }
    location /ws/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location ~ ^/(health|docs|openapi.json|media/) {
        proxy_pass http://$backend;
    }
    # TLS: prod'da 443 server bloki va sertifikat (certbot) qo'shiladi
}
