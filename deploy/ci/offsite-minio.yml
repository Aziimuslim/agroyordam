# Faqat CI uchun: tashqi zaxira xotirasini (S3) MinIO bilan sinash.
services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment: {MINIO_ROOT_USER: ciaccesskey, MINIO_ROOT_PASSWORD: cisecretkey123}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["sh", "-c", "mc alias set m http://minio:9000 ciaccesskey cisecretkey123 && mc mb -p m/agro-ci"]
  backup:
    depends_on:
      minio-init: {condition: service_completed_successfully}
