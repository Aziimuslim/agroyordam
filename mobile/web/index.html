<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AgroYordam — AI yordamida ekin kasalliklarini tashxislash">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AgroYordam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AgroYordam</title>
  <meta name="theme-color" content="#FBF6EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101912" media="(prefers-color-scheme: dark)">
  <!-- TZ DM01: Flutter yuklanguncha fon tanlangan mavzuga mos (oq chaqnash yo'q) -->
  <style>html,body{background:#FBF6EA;margin:0}@media (prefers-color-scheme: dark){html,body{background:#101912}}</style>
  <script>
    try {
      var m = JSON.parse(localStorage.getItem('flutter.agro_theme_mode') || 'null');
      if (m === 'dark' || m === 'light') {
        var bg = m === 'dark' ? '#101912' : '#FBF6EA';
        var st = document.createElement('style');
        st.textContent = 'html,body{background:' + bg + ' !important}';
        document.head.appendChild(st);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (e) { e.setAttribute('content', bg); });
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
