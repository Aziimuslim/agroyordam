name: agroyordam

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agro}
      POSTGRES_DB: ${POSTGRES_DB:-agroyordam}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agro}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  ai-service:
    image: ${IMAGE_REGISTRY:-agroyordam}/ai-service:${IMAGE_TAG:-latest}
    build: ./ai-service
    expose: ["8001"]   # faqat ichki tarmoq — tashqariga yopiq

  backend:
    image: ${IMAGE_REGISTRY:-agroyordam}/backend:${IMAGE_TAG:-latest}
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://agro:agro@db:5432/agroyordam}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_SERVICE_URL: http://ai-service:8001
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/agroyordam}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:-http://localhost/premium}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}
      ai-service: {condition: service_started}
    expose: ["8000"]

  web:
    image: ${IMAGE_REGISTRY:-agroyordam}/web:${IMAGE_TAG:-latest}
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    ports: ["80:80"]

volumes:
  pgdata:
  miniodata:
